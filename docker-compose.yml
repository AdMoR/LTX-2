services:
  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ltx-server:
    build:
      context: .
      dockerfile: packages/ltx-server/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Mount model weights (read-only)
      - ${LTX_MODELS_PATH:-./models}:/models:ro
      # Temp storage for processing
      - ltx-temp:/tmp/ltx
    environment:
      # Pipeline configuration
      - LTX_PIPELINES=${LTX_PIPELINES:-distilled}
      - LTX_CHECKPOINT_PATH=/models/ltx2.safetensors
      - LTX_GEMMA_ROOT=/models/gemma
      - LTX_SPATIAL_UPSAMPLER_PATH=/models/upsampler.safetensors
      - LTX_DISTILLED_LORA_PATH=${LTX_DISTILLED_LORA_PATH:-}
      - LTX_FP8_TRANSFORMER=${LTX_FP8_TRANSFORMER:-true}
      - LTX_TEXT_ENCODER_4BIT=${LTX_TEXT_ENCODER_4BIT:-true}
      # S3/MinIO configuration
      - S3_BUCKET=${S3_BUCKET:-ltx-outputs}
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=${S3_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped

volumes:
  minio-data:
  ltx-temp:
